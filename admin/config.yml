  # ---------- RIDDLE ----------
  - name: riddle
    label: Riddle
    label_singular: Riddle
    folder: src/riddle
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — status: {{fields.published}}"
    sortable_fields: [date, title]

    fields:
      - { label: Judul, name: title, widget: string }

      - label: Kategori
        name: category
        widget: select
        default: Horror Riddle
        options: [Horror Riddle, Detective, Psychological, Paranormal, Urban Legend, Mystery]

      - { label: "Tingkat kesulitan (1-5)", name: difficulty, widget: number, value_type: int, min: 1, max: 5, default: 4 }

      - { label: "Ringkasan (muncul di kartu)", name: excerpt, widget: string }

      - { label: "Kalimat pembuka (opsional)", name: lead, widget: string, required: false }

      # Sistem lama — sementara tetap ada untuk riddle lama
      - { label: "Reveal setelah (hari)", name: revealDays, widget: number, value_type: int, default: 7, required: false }

      # Sistem reveal baru
      - label: "Tanggal & jam reveal"
        name: revealAt
        widget: datetime
        required: false
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "Jawaban / penjelasan reveal"
        name: answer
        widget: text
        required: false

      - { label: "Jumlah diskusi (angka tampilan)", name: discussions, widget: number, value_type: int, default: 0, required: false }

      - label: "Pilihan jawaban (buat voting)"
        name: options
        widget: list
        required: false
        field: { label: Pilihan, name: choice, widget: string }

      - { label: Tanggal, name: date, widget: datetime }

      - { label: "Tayangkan sekarang?", name: published, widget: boolean, default: false }

      - { label: "Isi riddle", name: body, widget: markdown }
