# ============================================================
# KONFIG CMS — BARU NGEH
# Auth: DecapBridge (PKCE)
# ============================================================

backend:
  name: git-gateway
  repo: besokmati/barungeh
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/eb98caab-c457-4e63-8259-f0395d869965/pkce
  auth_token_endpoint: /sites/eb98caab-c457-4e63-8259-f0395d869965/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'


auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url


# ============================================================
# SITE
# ============================================================

site_url: https://barungeh.web.id
display_url: https://barungeh.web.id
logo_url: https://barungeh.web.id/assets/favicon.png
locale: id


# ============================================================
# MEDIA
# ============================================================

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"


# ============================================================
# COLLECTIONS
# ============================================================

collections:

  # ----------------------------------------------------------
  # RIDDLE
  # ----------------------------------------------------------

  - name: riddle
    label: Riddle
    label_singular: Riddle
    folder: src/riddle
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — status: {{fields.published}}"
    sortable_fields:
      - date
      - title

    fields:

      - label: Judul
        name: title
        widget: string

      - label: Kategori
        name: category
        widget: select
        default: Horror Riddle
        options:
          - Horror Riddle
          - Detective
          - Psychological
          - Paranormal
          - Urban Legend
          - Mystery

      - label: "Tingkat kesulitan (1-5)"
        name: difficulty
        widget: number
        value_type: int
        min: 1
        max: 5
        default: 4

      - label: "Ringkasan (muncul di kartu)"
        name: excerpt
        widget: string

      - label: "Kalimat pembuka (opsional)"
        name: lead
        widget: string
        required: false

      # Fallback sistem reveal lama
      - label: "Reveal setelah (hari)"
        name: revealDays
        widget: number
        value_type: int
        default: 7
        required: false

      # Sistem reveal baru
      - label: "Tanggal & jam reveal"
        name: revealAt
        widget: datetime
        required: false
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "Jawaban / penjelasan reveal"
        name: answer
        widget: text
        required: false

      - label: "Jumlah diskusi (angka tampilan)"
        name: discussions
        widget: number
        value_type: int
        default: 0
        required: false

      - label: "Pilihan jawaban (buat voting)"
        name: options
        widget: list
        required: false
        field:
          label: Pilihan
          name: choice
          widget: string

      - label: Tanggal
        name: date
        widget: datetime

      - label: "Tayangkan sekarang?"
        name: published
        widget: boolean
        default: false

      - label: "Isi riddle"
        name: body
        widget: markdown


  # ----------------------------------------------------------
  # CERITA
  # ----------------------------------------------------------

  - name: cerita
    label: Cerita
    label_singular: Cerita
    folder: src/cerita
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — status: {{fields.published}}"
    sortable_fields:
      - date
      - title

    fields:

      - label: Judul
        name: title
        widget: string

      - label: Kategori
        name: category
        widget: select
        default: Horror
        options:
          - Horror
          - Mystery
          - Psychological
          - Urban Legend
          - Detective
          - Paranormal

      - label: "Ringkasan (muncul di kartu)"
        name: excerpt
        widget: string

      - label: "Kalimat pembuka (opsional)"
        name: lead
        widget: string
        required: false

      - label: Tanggal
        name: date
        widget: datetime

      - label: "Tayangkan sekarang?"
        name: published
        widget: boolean
        default: false

      - label: "Isi cerita"
        name: body
        widget: markdown
